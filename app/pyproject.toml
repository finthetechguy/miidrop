[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "miidrop-app"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PyGObject>=3.48", "miidrop"]

[project.scripts]
miidrop-app = "miidrop_app.main:main"

[tool.setuptools]
packages = ["miidrop_app"]
